name: CI rust

# Pull requests only, and only when the Tauri/Rust side changes
# (e.g. Dependabot Cargo.lock bumps, capabilities, tauri.conf.json).
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/ci-rust.yml'

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      # tauri::generate_context! embeds the built frontend, so dist/ must exist.
      - name: Build frontend
        run: |
          npm ci
          npx vite build

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
