name: Retarget Dependabot PRs

# Dependabot security updates always open against the default branch.
# Move them to update-libs (also after a Dependabot rebase resets the base).
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  retarget:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Change base to update-libs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --base update-libs
