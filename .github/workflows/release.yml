name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: build every platform and upload the bundles as workflow artifacts,
  # without creating a release or touching latest.json.
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          # 22.04 (older glibc) so the AppImage runs on more distributions
          - platform: ubuntu-22.04
            bundles: appimage,deb

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;

            // Get all tags sorted by date
            const tags = await github.rest.repos.listTags({ owner, repo, per_page: 100 });

            // Find previous tag (the one before current)
            const currentIndex = tags.data.findIndex(t => t.name === tag);
            const previousTag = currentIndex < tags.data.length - 1 ? tags.data[currentIndex + 1].name : null;
            const changelog = previousTag
              ? `\n\n**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previousTag}...${tag}`
              : '';

            // 1) Annotated tag message wins: git tag -a vX.Y.Z --cleanup=whitespace -F notes.md
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.object.type === 'tag') {
              const { data: tagObj } = await github.rest.git.getTag({ owner, repo, tag_sha: ref.object.sha });
              const message = tagObj.message.split('-----BEGIN PGP SIGNATURE-----')[0].trim();
              if (message && message !== tag) {
                const releaseNotes = message + changelog;
                core.setOutput('notes', releaseNotes);
                return releaseNotes;
              }
            }

            // 2) Fallback: commit list without bot/dependency/merge noise
            let releaseNotes = '';

            if (previousTag) {
              const comparison = await github.rest.repos.compareCommits({ owner, repo, base: previousTag, head: tag });

              const isBot = c => /\[bot\]$/.test(c.author?.login || '') || /\[bot\]$/.test(c.commit.author.name);
              const isNoise = msg => /^(Bump |Merge |Revert "Bump |update latest\.json)/i.test(msg);

              const lines = [];
              let dependencyUpdates = 0;
              for (const commit of comparison.data.commits) {
                const message = commit.commit.message.split('\n')[0]; // First line only
                if (isBot(commit) || isNoise(message)) {
                  if (/^Bump /i.test(message)) dependencyUpdates++;
                  continue;
                }
                const author = commit.commit.author.name;
                lines.push(`- ${message} (@${commit.author?.login || author})`);
              }
              if (dependencyUpdates > 0) {
                lines.push(`- Updated dependencies (${dependencyUpdates} updates)`);
              }

              releaseNotes = '## What\'s Changed\n\n' + (lines.length ? lines.join('\n') : '- Maintenance release') + changelog;
            } else {
              releaseNotes = 'Initial release\n\nSee the assets below to download and install.';
            }

            core.setOutput('notes', releaseNotes);
            return releaseNotes;

      - name: Build and create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RPG Save Editor ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Build only (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Upload bundles (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  update-latest-json:
    needs: release
    # Also run when only one platform failed (e.g. Linux), so Windows users still
    # get the update; the script requires the Windows installer and warns if the
    # AppImage is missing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace('v', '');

            // Get release by tag
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });

            const assets = release.data.assets;
            const find = (suffix) => assets.find((asset) => asset.name.endsWith(suffix));
            const signatureOf = async (asset) => {
              if (!asset) return '';
              const response = await github.request('GET ' + asset.url, { headers: { accept: 'application/octet-stream' } });
              return Buffer.from(response.data).toString('utf-8').trim();
            };

            // Windows: NSIS installer; Linux: AppImage (the updater replaces the AppImage file)
            const setupAsset = find('setup.exe');
            const appImageAsset = find('.AppImage');
            if (!setupAsset) {
              core.setFailed('Setup executable not found in release assets');
              return;
            }

            const platforms = {
              'windows-x86_64': { signature: await signatureOf(find('setup.exe.sig')), url: setupAsset.browser_download_url },
            };
            if (appImageAsset) {
              platforms['linux-x86_64'] = { signature: await signatureOf(find('.AppImage.sig')), url: appImageAsset.browser_download_url };
            } else {
              core.warning('No AppImage in release assets: latest.json will only list Windows');
            }

            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('notes', release.data.body || '');
            core.setOutput('pub_date', release.data.published_at);
            core.setOutput('platforms', JSON.stringify(platforms));

      - name: Update latest.json
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          PUB_DATE: ${{ steps.release.outputs.pub_date }}
          PLATFORMS: ${{ steps.release.outputs.platforms }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' > docs/latest.json
          # Builds <= v1.2.0 poll raw.githubusercontent.com/.../main/latest.json; keep it in sync.
          cp docs/latest.json latest.json

      - name: Commit and push latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json latest.json
          git commit -m "update latest.json for ${{ steps.release.outputs.tag }}"
          git push origin main
